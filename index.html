<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366F1">
  <title>Door Mirror Inspection App</title>
  <style>
    /* =========================================================
       DESIGN TOKENS
       ========================================================= */
    :root {
      --bg: #F6F9FF;
      --chrome: #4974BD;
      --surface: #FFFFFF;
      --surface-2: #F3F4F6;
      --border: #E5E7EB;
      --border-strong: #D1D5DB;
      --text: #111827;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --accent: #6366F1;
      --accent-bg: #EEF2FF;
      --accent-text: #4338CA;
      --success: #10B981;
      --success-bg: #D1FAE5;
      --success-text: #065F46;
      --warning: #F59E0B;
      --warning-bg: #FEF3C7;
      --warning-text: #92400E;
      --danger: #EF4444;
      --danger-bg: #FEE2E2;
      --danger-text: #991B1B;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-pill: 999px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    }

    /* =========================================================
       RESET & BASE
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      font-size: 14px;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }
    button { font-family: inherit; cursor: pointer; }
    input, select { font-family: inherit; font-size: 14px; }

    /* =========================================================
       APP SHELL
       ========================================================= */
    header.app-header {
      position: sticky;
      top: 0;
      background: var(--chrome);
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding: 14px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .brand { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .brand-name { font-size: 15px; font-weight: 600; color: #FFFFFF; }
    .brand-meta { font-size: 11px; color: #FFFFFF; margin-top: 2px; }
    .live-pill {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent-bg); color: var(--accent-text);
      font-size: 11px; font-weight: 600;
      padding: 4px 10px; border-radius: var(--radius-pill);
    }
    .live-pill::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent-text);
    }

    main {
      padding: clamp(12px, 3vw, 24px);
      padding-bottom: 96px;
      max-width: 1080px;
      margin: 0 auto;
      width: 100%;
    }

    nav.tab-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--chrome);
      border-top: 1px solid rgba(255,255,255,0.2);
      display: flex;
      z-index: 10;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .tab-bar button {
      flex: 1; background: none; border: none;
      padding: 14px 8px 16px;
      font-size: 12px; font-weight: 500;
      color: rgba(255,255,255,0.65);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .tab-bar button.active { color: #FFFFFF; }
    .tab-icon {
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* =========================================================
       SECTIONS, CARDS, TYPOGRAPHY
       ========================================================= */
    .page-title { font-size: clamp(18px, 3.5vw, 24px); font-weight: 600; margin: 0 0 4px; }

    /* Dashboard header with date control */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .dashboard-header-text { min-width: 0; }
    .date-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      flex-shrink: 0;
    }
    .date-control-icon {
      color: var(--text-secondary);
      display: flex;
      flex-shrink: 0;
    }
    .date-control-input {
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      padding: 0;
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
    }
    .date-control-input:focus { outline: none; }
    .today-btn {
      border: none;
      background: var(--accent-bg);
      color: var(--accent-text);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: var(--radius-pill);
      flex-shrink: 0;
    }
    .page-subtitle { font-size: clamp(12px, 2.2vw, 14px); color: var(--text-secondary); margin: 0 0 16px; }

    .section-label {
      font-size: 11px; font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 18px 4px 8px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .card-flush { padding: 0; overflow: hidden; }

    /* =========================================================
       KPI CARDS GRID
       ========================================================= */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(6px, 1.5vw, 12px);
      margin-bottom: 12px;
    }

    /* =========================================================
       FLUID / RESPONSIVE BREAKPOINTS
       ========================================================= */
    /* Narrow phones */
    @media (max-width: 480px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .form-row { grid-template-columns: 1fr; }
      .plan-header-grid { grid-template-columns: 1fr 1fr; }
      /* Phone: Model | Variance on row 1; Lots | Sides on row 2 */
      .model-row-inline {
        grid-template-columns: minmax(0, 1fr) 90px;
        gap: 8px 6px;
      }
      .model-row-inline .checkbox-pill {
        padding: 6px 8px;
        font-size: 11px;
      }
      .model-row { padding: 12px 32px 12px 12px; }
      .insp-header-meta { grid-template-columns: repeat(2, 1fr); row-gap: 10px; }
    }
    /* Tablets and up: two-column layout for check item cards */
    @media (min-width: 720px) {
      .check-items-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .check-items-grid .check-item-card { margin-bottom: 0; }
      .insp-list-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .insp-list-grid .insp-card { margin-bottom: 0; }
    }
    /* Wide desktop: three-column inspection lists */
    @media (min-width: 1000px) {
      .insp-list-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(10px, 2.5vw, 16px);
      text-align: center;
    }
    .kpi-card.clickable {
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    }
    .kpi-card.clickable:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .kpi-card.clickable:active {
      transform: translateY(0);
      box-shadow: var(--shadow-sm);
    }
    .kpi-value { font-size: clamp(20px, 4vw, 26px); font-weight: 600; line-height: 1.2; }
    .kpi-label { font-size: clamp(10px, 2vw, 12px); color: var(--text-secondary); margin-top: 2px; }
    .kpi-value.scheduled { color: var(--accent); }
    .kpi-value.completed { color: var(--success); }
    .kpi-value.in-progress { color: var(--warning); }
    .kpi-value.overdue { color: var(--danger); }

    /* =========================================================
       INSPECTION LIST CARD (DASHBOARD)
       ========================================================= */
    .insp-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      margin-bottom: 8px;
      transition: background 0.15s;
    }
    .insp-card:active { background: var(--surface-2); }
    .insp-card.clickable { cursor: pointer; }
    .insp-bar { width: 4px; flex-shrink: 0; }
    .insp-bar.completed { background: var(--success); }
    .insp-bar.in-progress { background: var(--accent); }
    .insp-bar.failed { background: var(--danger); }
    .insp-bar.scheduled { background: var(--border-strong); }
    .insp-bar.overdue { background: var(--warning); }

    .insp-body {
      padding: 12px 14px;
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .insp-main { min-width: 0; flex: 1; }
    .insp-id-title {
      font-size: 13px; color: var(--text);
      margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .insp-id { font-weight: 600; }
    .insp-meta { font-size: 12px; color: var(--text-secondary); }
    .insp-meta .status-text { font-weight: 600; }
    .status-text.passed { color: var(--success-text); }
    .status-text.in-progress { color: var(--accent-text); }
    .status-text.failed { color: var(--danger-text); }
    .status-text.scheduled { color: var(--text-secondary); }
    .status-text.overdue { color: var(--warning-text); }

    .status-pill {
      font-size: 10px; font-weight: 600;
      padding: 4px 10px; border-radius: var(--radius-pill);
      flex-shrink: 0;
    }
    .status-pill.completed { background: var(--success-bg); color: var(--success-text); }
    .status-pill.in-progress { background: var(--accent-bg); color: var(--accent-text); }
    .status-pill.failed { background: var(--danger-bg); color: var(--danger-text); }
    .status-pill.scheduled { background: var(--surface-2); color: var(--text-secondary); }
    .status-pill.overdue { background: var(--warning-bg); color: var(--warning-text); }

    /* =========================================================
       FORM ELEMENTS
       ========================================================= */
    .form-grid { display: grid; gap: 10px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    /* 3-column header grid for the production plan (Date/Shift/Supv | Line/Cust/Leader) */
    .plan-header-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    /* Plan header field labels: darker, matching the 'Models' sublabel weight */
    .plan-header-grid .form-field label {
      color: var(--text);
      font-weight: 600;
    }
    /* Grey out selects/inputs that are still on their placeholder (empty value).
       !important helps override mobile browsers' native select styling. */
    select.is-placeholder,
    input.is-placeholder { color: #AFB6C2 !important; }
    select option { color: var(--text); }
    select.is-placeholder option[value=""][disabled] { color: #AFB6C2; }
    select option[value=""][disabled] { color: #AFB6C2; }
    input::placeholder { color: #AFB6C2 !important; opacity: 1; }
    input.is-placeholder::-webkit-datetime-edit { color: #AFB6C2 !important; }

    /* =========================================================
       CUSTOM DROPDOWN (consistent look on every device)
       ========================================================= */
    .dropdown { position: relative; }
    .dropdown-btn {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: 14px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .dropdown-btn:hover { border-color: var(--text-muted); }
    .dropdown-btn.open {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }
    .dropdown-label {
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dropdown-btn.is-placeholder .dropdown-label { color: #AFB6C2; }
    .dropdown-arrow {
      color: var(--text-muted);
      font-size: 11px;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .dropdown-btn.open .dropdown-arrow { transform: rotate(180deg); }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      z-index: 20;
    }
    .dropdown-menu.open { display: block; }
    .dropdown-option {
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
    }
    .dropdown-option:hover { background: var(--surface-2); }
    .dropdown-option.selected {
      background: var(--accent-bg);
      color: var(--accent-text);
      font-weight: 600;
    }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-field label {
      font-size: 11px; font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }
    .form-field input, .form-field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    /* iOS renders date inputs taller and misaligned by default.
       Normalize height so Date matches the dropdowns beside it. */
    .form-field input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      height: 42px;
      line-height: 1.2;
      min-height: 42px;
    }
    .dropdown-btn { height: 42px; }
    .form-field input:focus, .form-field select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }
    .checkbox-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .checkbox-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill);
      background: var(--surface);
      font-size: 13px;
      user-select: none;
      transition: all 0.15s;
    }
    .checkbox-pill input { display: none; }
    .checkbox-pill.checked {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
    }

    .btn {
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 14px; font-weight: 500;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--surface-2); }
    .btn-primary {
      background: var(--accent); color: white; border-color: var(--accent);
    }
    .btn-primary:hover { background: var(--accent-text); border-color: var(--accent-text); }
    .btn-block { width: 100%; }

    /* =========================================================
       FILTER PILLS
       ========================================================= */
    .filter-row {
      display: flex; gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-pill {
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 12px; font-weight: 500;
      white-space: nowrap;
    }
    .filter-pill.active {
      background: var(--text); color: var(--surface);
      border-color: var(--text);
    }

    /* =========================================================
       HISTORY SEARCH + FILTER TOOLBAR
       ========================================================= */
    .history-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .search-box {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      display: flex;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-clear {
      position: absolute;
      right: 8px;
      width: 22px; height: 22px;
      border: none;
      background: var(--surface-2);
      color: var(--text-secondary);
      border-radius: 50%;
      font-size: 15px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .filter-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }
    .filter-toggle-btn.active {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent-text);
    }
    .filter-badge {
      background: var(--accent);
      color: white;
      font-size: 10px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .advanced-filters {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
    }
    .date-quick-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .date-quick-row .filter-pill {
      padding: 6px 4px;
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
    }
    .date-range-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .date-range-row input[type="date"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      box-sizing: border-box;
      -webkit-appearance: none;
      height: 38px;
    }

    /* =========================================================
       CHECK SHEET DETAIL VIEW
       ========================================================= */
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      background: none; border: none;
      color: var(--text-secondary);
      font-size: 13px; font-weight: 500;
      margin-left: -8px; margin-bottom: 8px;
    }

    .insp-header-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .insp-header-top {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 8px;
    }
    .insp-header-id {
      font-size: 11px; font-weight: 600;
      color: var(--text-muted); letter-spacing: 0.05em;
    }
    .insp-header-title {
      font-size: 15px; font-weight: 600;
      margin-bottom: 12px;
    }
    .insp-header-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 8px;
      font-size: 11px;
    }
    .insp-header-meta .label { color: var(--text-muted); }
    .insp-header-meta .value { color: var(--text); font-weight: 600; margin-top: 2px; }
    .progress-bar {
      height: 4px;
      background: var(--surface-2);
      border-radius: var(--radius-pill);
      margin-top: 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--accent);
      transition: width 0.3s;
    }

    .check-item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      margin-bottom: 8px;
    }
    .check-item-bar { width: 4px; flex-shrink: 0; }
    .check-item-bar.ok { background: var(--success); }
    .check-item-bar.ng { background: var(--danger); }
    .check-item-bar.pending { background: var(--border-strong); }

    .check-item-body { padding: 12px 14px; flex: 1; }
    .check-item-top {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 8px; margin-bottom: 6px;
    }
    .check-item-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .check-item-standard {
      font-size: 11px; color: var(--text-secondary);
      margin-bottom: 10px; line-height: 1.5;
    }
    .check-item-standard .value { color: var(--text); font-weight: 600; }
    .check-item-standard .auto { color: var(--text-muted); }
    .check-item-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 11px;
    }
    .check-item-controls.single { grid-template-columns: 1fr; }
    .control-readout {
      background: var(--surface-2);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
    }

    const PCS_PER_LOT = 30;  // 1 lot = 30 pcs per side (adjust if line standard changes)

    // Today's real date as "YYYY-MM-DD"
    function todayISO() {
      const d = new Date();
      const off = d.getTimezoneOffset();
      const local = new Date(d.getTime() - off * 60000);
      return local.toISOString().slice(0, 10);
    }
    // Format "2026-07-04" → "Fri, 4 Jul 2026"
    function formatFullDate(iso) {
      if (!iso) return '';
      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const [y, m, d] = iso.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return `${days[dt.getDay()]}, ${d} ${months[m - 1]} ${y}`;
    }
    // Inspections for the date currently selected on the dashboard
    function dashboardInspections() {
      return DB.inspections.filter(i => i.date === state.dashboardDate);
    }

    function kpis(list) {
      const all = list || DB.inspections;
      return {
        scheduled: all.length,
        completed: all.filter(i => i.status === 'Completed').length,
        inProgress: all.filter(i => i.status === 'In Progress').length,
        overdue: all.filter(i => i.status === 'Overdue').length
      };
    }
    function calculateTotalQty() {
      return state.planForm.models.reduce((sum, m) =>
        sum + (parseInt(m.lots) || 0) * m.sides.length * PCS_PER_LOT, 0
      );
    }
    // Aggregate completion by model. Returns [{ label, done, total, pct }]
    // Extensible: swap the groupBy key later to chart by process, line, customer, etc.
    function progressByModel(list) {
      const src = list || DB.inspections;
      const groups = {};
      src.forEach(ins => {
        if (!groups[ins.model]) groups[ins.model] = { done: 0, total: 0 };
        groups[ins.model].done += ins.done;
        groups[ins.model].total += ins.total;
      });
      return Object.keys(groups).map(model => {
        const g = groups[model];
        const pct = g.total > 0 ? Math.round((g.done / g.total) * 100) : 0;
        return { label: model, done: g.done, total: g.total, pct };
      }).sort((a, b) => b.pct - a.pct);
    }
    function getStandard(ci, modelCode) {
      if (!ci.model_dependent) return ci.standard;
      const spec = DB.modelSpecs[`${ci.ci_id}|${modelCode}`];
      return spec ? spec.value : '(no spec)';
    }
    // Is this control item applicable to the given model?
    // 'ALL' items always apply; otherwise the model must be in the list.
    function isApplicable(ci, model) {
      if (!ci.applicable_models || ci.applicable_models === 'ALL') return true;
      return ci.applicable_models.split(',').map(s => s.trim()).includes(model);
    }
    function getProcess(processId) {
      return DB.processes.find(p => p.process_id === processId);
    }
    function getInspection(id) {
      return DB.inspections.find(i => i.id === id);
    }
    function getResult(inspId, ciId) {
      return DB.results[`${inspId}|${ciId}`] || null;
    }
    function statusClass(status) {
      const map = { 'Completed': 'completed', 'In Progress': 'in-progress',

    // Build a custom dropdown's HTML.
    // field = the planForm key (e.g. 'shift'); options = array of values; current = selected value
    function customDropdown(field, options, current) {
      const isEmpty = !current;
      const optionsHtml = options.map(opt => `
        <div class="dropdown-option ${opt === current ? 'selected' : ''}"
             data-dd-field="${field}" data-dd-value="${opt}">${opt}</div>
      `).join('');
      return `
        <div class="dropdown" data-dd-name="${field}">
          <button type="button" class="dropdown-btn ${isEmpty ? 'is-placeholder' : ''}" data-dd-toggle="${field}">
            <span class="dropdown-label">${isEmpty ? 'select…' : current}</span>
            <span class="dropdown-arrow">&#9662;</span>
          </button>
          <div class="dropdown-menu" data-dd-menu="${field}">
            ${optionsHtml}
          </div>
        </div>
      `;
    }

                <label>Line</label>

              <div class="form-field">
                <label>Duty Supv</label>
                ${customDropdown('supv', ['Raj', 'Bob Husin'], state.planForm.supv)}

            <div class="section-sublabel">Models</div>
            ${state.planForm.models.map((m, idx) => {

              return `
                <div class="model-row">

                  <div class="model-row-inline">
                    <div class="form-field">
                      <label>Model</label>
                      ${customDropdownRow(idx, DB.models.map(mm => mm.model_code), m.model)}
                    </div>
                    <div class="form-field">
                      <label>Variance</label>
                      ${varianceDropdownRow(idx, m.variance)}
                    </div>
                    <div class="form-field">
                      <label>Lots</label>
                      <input type="number" min="1" value="${m.lots}" placeholder="No."

                    <div class="form-field">
                      <label>Sides</label>
                      <div class="checkbox-group">
                        <label class="checkbox-pill ${m.sides.includes('RH-L')?'checked':''}" data-row-idx="${idx}" data-side-pill="RH-L">RH-L</label>
                        <label class="checkbox-pill ${m.sides.includes('RH-R')?'checked':''}" data-row-idx="${idx}" data-side-pill="RH-R">RH-R</label>
                      </div>
                    </div>

                  <div class="row-qty-display">
                    <span>${m.lots || 0} lot &times; ${m.sides.length} side &times; ${PCS_PER_LOT} =</span>

            <div class="total-qty-display">
              <div>
                <div class="total-qty-label">Target qty (auto)</div>
                <div class="total-qty-subtle">1 lot = ${PCS_PER_LOT} pcs per side</div>

              <div class="total-qty-value">${totalQty} pcs</div>

        <div class="section-label">Active inspections</div>
        ${dayInsp.length === 0 ? `
          <div class="empty-state">
            <div class="title">No inspections on this date</div>
            <div class="desc">Pick another date above, or create a production plan below.</div>
          </div>
        ` : `<div class="insp-list-grid">
        ${dayInsp.map(ins => `
          <div class="insp-card clickable" data-action="open-inspection" data-id="${ins.id}">
            <div class="insp-bar ${statusClass(ins.status)}"></div>
            <div class="insp-body">
              <div class="insp-main">
                <div class="insp-id-title">
                  <span class="insp-id">${ins.id}</span>
                  &middot;
                  <span>${ins.model}${ins.variance ? ' ' + ins.variance : ''} ${ins.side}</span>
                </div>
                <div class="insp-meta">
                  ${ins.line} &middot; ${ins.done}/${ins.total} items
                  ${ins.result ? ` &middot; <span class="status-text ${statusClass(ins.status)}">${ins.result}</span>` : ''}

              <div class="status-pill ${statusClass(ins.status)}">${ins.status}</div>

    // =========================================================
    // VIEW: FILL CHECK SHEET (list mode)
    // =========================================================
    function renderFillList() {
      const activeStatuses = ['In Progress', 'Scheduled', 'Overdue'];
      let active = DB.inspections.filter(i => activeStatuses.includes(i.status));
      const filter = state.fillFilter;
      if (filter !== 'all') {
        active = active.filter(i => statusClass(i.status) === filter);
      }
      return `
        <h1 class="page-title">Fill check sheet</h1>
        <p class="page-subtitle">Pick an inspection to start or continue</p>

        <div class="filter-row">
          <button class="filter-pill ${filter==='all'?'active':''}" data-action="set-fill-filter" data-val="all">All</button>
          <button class="filter-pill ${filter==='scheduled'?'active':''}" data-action="set-fill-filter" data-val="scheduled">Scheduled</button>
          <button class="filter-pill ${filter==='in-progress'?'active':''}" data-action="set-fill-filter" data-val="in-progress">In progress</button>
          <button class="filter-pill ${filter==='overdue'?'active':''}" data-action="set-fill-filter" data-val="overdue">Overdue</button>
        </div>

        ${active.length === 0 ? `
          <div class="empty-state">
            <div class="title">No inspections here</div>
            <div class="desc">Try another filter, or create a production plan in the Dashboard tab.</div>
          </div>
        ` : `<div class="insp-list-grid">` + active.map(ins => `
          <div class="insp-card clickable" data-action="open-inspection" data-id="${ins.id}">
            <div class="insp-bar ${statusClass(ins.status)}"></div>
            <div class="insp-body">
              <div class="insp-main">
                <div class="insp-id-title">
                  <span class="insp-id">${ins.id}</span>
                  &middot;
                  <span>${ins.model}${ins.variance ? ' ' + ins.variance : ''} ${ins.side}</span>
                </div>
                <div class="insp-meta">
                  ${ins.line} &middot; ${ins.done}/${ins.total} items
                </div>
              </div>
              <div class="status-pill ${statusClass(ins.status)}">${ins.status}</div>
            </div>
          </div>
        `).join('') + `</div>`}
      `;
    }

    // =========================================================
    // VIEW: FILL CHECK SHEET (detail mode)
    // =========================================================
    function renderFillDetail(inspId) {
      const ins = getInspection(inspId);
      if (!ins) return renderFillList();

      // Only show control items applicable to THIS inspection's model
      const applicable = DB.controlItems.filter(ci => isApplicable(ci, ins.model));

      // Group applicable items by process
      const itemsByProcess = {};
      applicable.forEach(ci => {
        if (!itemsByProcess[ci.process_id]) itemsByProcess[ci.process_id] = [];
        itemsByProcess[ci.process_id].push(ci);
      });

      // Real progress based on applicable items (not a hardcoded total)
      const total = applicable.length;
      let done = 0;
      applicable.forEach(ci => { if (getResult(inspId, ci.ci_id)) done++; });
      const progress = total > 0 ? Math.round((done / total) * 100) : 0;

      // Show processes in their proper sequence order
      const orderedPids = Object.keys(itemsByProcess)
        .sort((a, b) => getProcess(a).seq - getProcess(b).seq);

      const sections = orderedPids.map(pid => {
        const proc = getProcess(pid);
        const items = itemsByProcess[pid];
        const procKey = `${inspId}|${pid}`;

        // How many items in this process are filled (have a judgement)?
        const filledCount = items.filter(ci => {
          const r = getResult(inspId, ci.ci_id);
          return r && r.judgement;
        }).length;
        const allFilled = filledCount === items.length;
        const pic = state.processPIC[procKey] || '';
        const dirty = state.dirtyProcesses[procKey];
        const saving = state.savingProcess === procKey;

        // Save button state
        let saveBtn;
        if (saving) {
          saveBtn = `<button class="proc-save-btn" disabled>Saving…</button>`;
        } else if (!allFilled || !pic) {
          saveBtn = `<button class="proc-save-btn" disabled>Save</button>`;
        } else if (dirty) {
          saveBtn = `<button class="proc-save-btn active" data-action="save-process" data-insp="${inspId}" data-proc="${pid}">Save ${pid}</button>`;
        } else {
          saveBtn = `<button class="proc-save-btn saved" disabled>&#10003; Saved</button>`;
        }

        return `
          <div class="proc-section">
            <div class="proc-header">
              <div class="proc-title">${proc.process_id} &middot; ${proc.name.toUpperCase()}</div>
              <div class="proc-header-right">
                <span class="proc-count ${allFilled ? 'done' : ''}">${filledCount}/${items.length}</span>
                ${saveBtn}
              </div>
            </div>
            <div class="proc-pic-row">
              <span class="proc-pic-label">PIC</span>
              ${picDropdown(procKey, pic)}
            </div>
            <div class="check-items-grid">
            ${items.map(ci => {
              const result = getResult(inspId, ci.ci_id);
              const standard = getStandard(ci, ins.model);
              const judged = result && result.judgement;
              const barClass = !judged ? 'pending' : (result.judgement === 'OK' ? 'ok' : 'ng');
              const pillClass = !judged ? 'scheduled' : (result.judgement === 'OK' ? 'completed' : 'failed');
              const pillText = !judged ? 'Pending' : result.judgement;

              // Build the fill controls based on item type
              let controls = '';
              if (ci.type === 'NUMERIC') {
                controls = `
                  <input type="number" step="any" class="item-input" placeholder="reading"
                    value="${result && result.value != null ? result.value : ''}"
                    data-num-insp="${inspId}" data-num-ci="${ci.ci_id}" data-proc="${pid}">
                  <div class="ok-ng-buttons">
                    <button class="${judged && result.judgement==='OK' ? 'selected ok' : ''}" data-action="set-judgement" data-insp="${inspId}" data-ci="${ci.ci_id}" data-proc="${pid}" data-val="OK">OK</button>
                    <button class="${judged && result.judgement==='NG' ? 'selected ng' : ''}" data-action="set-judgement" data-insp="${inspId}" data-ci="${ci.ci_id}" data-proc="${pid}" data-val="NG">NG</button>
                  </div>`;
              } else if (ci.type === 'TEXT') {
                if (ci.model_dependent) {
                  // Dropdown of standard options (default = model's standard) + OK/NG
                  const options = getStandardOptions(ci.ci_id);
                  const current = (result && result.text) ? result.text : standard;
                  controls = `
                    ${standardDropdown(inspId, ci.ci_id, pid, options, current)}
                    <div class="ok-ng-buttons" style="margin-top:6px;">
                      <button class="${judged && result.judgement==='OK' ? 'selected ok' : ''}" data-action="set-judgement" data-insp="${inspId}" data-ci="${ci.ci_id}" data-proc="${pid}" data-val="OK">OK</button>
                      <button class="${judged && result.judgement==='NG' ? 'selected ng' : ''}" data-action="set-judgement" data-insp="${inspId}" data-ci="${ci.ci_id}" data-proc="${pid}" data-val="NG">NG</button>
                    </div>`;
                } else {
                  // Free text (e.g. Stamp Date)
                  controls = `
                    <input type="text" class="item-input wide" placeholder="enter value"
                      value="${result && result.text != null ? result.text : ''}"
                      data-text-insp="${inspId}" data-text-ci="${ci.ci_id}" data-proc="${pid}">`;
                }
              } else if (ci.type === 'DETECT') {
                controls = `
                  <div class="ok-ng-buttons">
                    <button class="${judged && result.judgement==='OK' ? 'selected ok' : ''}" data-action="set-judgement" data-insp="${inspId}" data-ci="${ci.ci_id}" data-proc="${pid}" data-val="OK">Detect</button>
                    <button class="${judged && result.judgement==='NG' ? 'selected ng' : ''}" data-action="set-judgement" data-insp="${inspId}" data-ci="${ci.ci_id}" data-proc="${pid}" data-val="NG">Not Detect</button>
                  </div>`;
              } else { // OK_NG
                controls = `
                  <div class="ok-ng-buttons">
                    <button class="${judged && result.judgement==='OK' ? 'selected ok' : ''}" data-action="set-judgement" data-insp="${inspId}" data-ci="${ci.ci_id}" data-proc="${pid}" data-val="OK">OK</button>
                    <button class="${judged && result.judgement==='NG' ? 'selected ng' : ''}" data-action="set-judgement" data-insp="${inspId}" data-ci="${ci.ci_id}" data-proc="${pid}" data-val="NG">NG</button>
                  </div>`;
              }

              return `
                <div class="check-item-card">
                  <div class="check-item-bar ${barClass}"></div>
                  <div class="check-item-body">
                    <div class="check-item-top">
                      <div class="check-item-name">${ci.name}</div>
                      <div class="status-pill ${pillClass}">${pillText}</div>
                    </div>
                    <div class="check-item-standard">
                      Standard: <span class="value">${standard}</span>
                      ${ci.model_dependent ? `<span class="auto"> &middot; auto-set for ${ins.model}</span>` : ''}
                    </div>
                    <div class="check-item-fill">${controls}</div>
                  </div>
                </div>
              `;
            }).join('')}
            </div>
          </div>
        `;
      }).join('');

      return `
        <button class="back-btn" data-action="back-to-fill-list">&larr; Back</button>

        <div class="insp-header-card">
          <div class="insp-header-top">
            <div class="insp-header-id">${ins.id}</div>
            <div class="status-pill ${statusClass(ins.status)}">${ins.status}</div>
          </div>
          <div class="insp-header-title">Door Mirror Job Setup &mdash; ${ins.model}${ins.variance ? ' ' + ins.variance : ''} ${ins.side}</div>
          <div class="insp-header-meta">
            <div><div class="label">Date</div><div class="value">${fmtDate(ins.date) || '-'}</div></div>
            <div><div class="label">Line / Shift</div><div class="value">${ins.line} / ${ins.shift}</div></div>
            <div><div class="label">Variance</div><div class="value">${ins.variance || '-'}</div></div>
            <div><div class="label">Leader</div><div class="value">${ins.leader || '-'}</div></div>
            <div><div class="label">Progress</div><div class="value">${done}/${total}</div></div>
            <div><div class="label">NG count</div><div class="value">${ins.ng}</div></div>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        </div>

        <div class="fill-hint">Fill every item in a process, pick a PIC, then tap <strong>Save</strong> for that process.</div>

        ${sections}
      `;
    }

    // Build a PIC dropdown for a process (reuses the custom-dropdown styles)
    function picDropdown(procKey, current) {
      const isEmpty = !current;
      const opts = DB.users.map(u => `
        <div class="dropdown-option ${u.name === current ? 'selected' : ''}"
             data-pic-proc="${procKey}" data-pic-value="${u.name}">${u.name}</div>
      `).join('');
      return `
        <div class="dropdown">
          <button type="button" class="dropdown-btn ${isEmpty ? 'is-placeholder' : ''}">
            <span class="dropdown-label">${isEmpty ? 'select PIC…' : current}</span>
            <span class="dropdown-arrow">&#9662;</span>
          </button>
          <div class="dropdown-menu">${opts}</div>
        </div>`;
    }

    // All distinct standard values available for a control item (across models).
    // Used to offer a dropdown of choices for model-dependent TEXT items.
    function getStandardOptions(ciId) {
      const opts = [];
      const seen = {};
      Object.keys(DB.modelSpecs).forEach(key => {
        if (key.indexOf(ciId + '|') === 0) {
          const v = DB.modelSpecs[key].value;
          if (v && !seen[v]) { seen[v] = true; opts.push(v); }
        }
      });
      return opts;
    }

    // Dropdown of standard values (default = model's standard, editable)
    function standardDropdown(inspId, ciId, pid, options, current) {
      const opts = options.map(o => `
        <div class="dropdown-option ${o === current ? 'selected' : ''}"
             data-std-insp="${inspId}" data-std-ci="${ciId}" data-std-proc="${pid}" data-std-value="${o}">${o}</div>
      `).join('');
      return `
        <div class="dropdown">
          <button type="button" class="dropdown-btn">
            <span class="dropdown-label">${current}</span>
            <span class="dropdown-arrow">&#9662;</span>
          </button>
          <div class="dropdown-menu">${opts}</div>
        </div>`;
    }

    // =========================================================
    // VIEW: HISTORY
    // =========================================================
    // Format an ISO date (2026-06-30) as "30 Jun" for display
    function fmtDate(iso) {
      if (!iso) return '';
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const [y, m, d] = iso.split('-');
      return `${parseInt(d)} ${months[parseInt(m) - 1]}`;
    }

    // Apply ALL active History filters (search + date range + status) together
    function filteredHistory() {
      let list = DB.inspections.slice();
      const q = state.historySearch.trim().toLowerCase();
      if (q) {
        list = list.filter(i =>
          i.id.toLowerCase().includes(q) ||
          i.model.toLowerCase().includes(q) ||
          i.side.toLowerCase().includes(q) ||
          i.line.toLowerCase().includes(q) ||
          (i.leader || '').toLowerCase().includes(q)
        );
      }
      if (state.historyDateFrom) list = list.filter(i => i.date && i.date >= state.historyDateFrom);
      if (state.historyDateTo)   list = list.filter(i => i.date && i.date <= state.historyDateTo);
      if (state.historyFilter !== 'all') {
        list = list.filter(i => statusClass(i.status) === state.historyFilter);
      }
      return list;
    }

    function renderHistory() {
      const filtered = filteredHistory();
      const filter = state.historyFilter;
      const open = state.historyFiltersOpen;

      // Count how many advanced filters are active (for the badge)
      const activeCount =
        (state.historySearch ? 1 : 0) +
        (state.historyDateFrom ? 1 : 0) +
        (state.historyDateTo ? 1 : 0);

      return `
        <h1 class="page-title">History</h1>
        <p class="page-subtitle">${filtered.length} of ${DB.inspections.length} inspections</p>

        <div class="history-toolbar">
          <div class="search-box">
            <span class="search-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input type="text" class="search-input" placeholder="Search ID, model, line, leader…"
              value="${state.historySearch}" data-history-search>
            ${state.historySearch ? `<button class="search-clear" data-action="history-clear-search" title="Clear">&times;</button>` : ''}
          </div>
          <button class="filter-toggle-btn ${open ? 'active' : ''}" data-action="toggle-history-filters">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
            Filters${activeCount ? ` <span class="filter-badge">${activeCount}</span>` : ''}
          </button>
        </div>

        ${open ? `
          <div class="advanced-filters">
            <div class="date-quick-row">
              <button class="filter-pill" data-action="history-quick-date" data-val="today">Today</button>
              <button class="filter-pill" data-action="history-quick-date" data-val="week">7 days</button>
              <button class="filter-pill" data-action="history-quick-date" data-val="month">Month</button>
              <button class="filter-pill" data-action="history-quick-date" data-val="clear">Clear</button>
            </div>
            <div class="date-range-row">
              <div class="form-field">
                <label>From</label>
                <input type="date" value="${state.historyDateFrom}" data-history-datefrom
                  class="${state.historyDateFrom ? '' : 'is-placeholder'}">
              </div>
              <div class="form-field">
                <label>To</label>
                <input type="date" value="${state.historyDateTo}" data-history-dateto
                  class="${state.historyDateTo ? '' : 'is-placeholder'}">
              </div>
            </div>
          </div>
        ` : ''}

        <div class="filter-row">
          <button class="filter-pill ${filter==='all'?'active':''}" data-action="set-history-filter" data-val="all">All</button>
          <button class="filter-pill ${filter==='completed'?'active':''}" data-action="set-history-filter" data-val="completed">Completed</button>
          <button class="filter-pill ${filter==='failed'?'active':''}" data-action="set-history-filter" data-val="failed">Failed</button>
          <button class="filter-pill ${filter==='in-progress'?'active':''}" data-action="set-history-filter" data-val="in-progress">In progress</button>
          <button class="filter-pill ${filter==='scheduled'?'active':''}" data-action="set-history-filter" data-val="scheduled">Scheduled</button>
          <button class="filter-pill ${filter==='overdue'?'active':''}" data-action="set-history-filter" data-val="overdue">Overdue</button>
        </div>

        ${filtered.length === 0 ? `
          <div class="empty-state">
            <div class="title">No records found</div>
            <div class="desc">Try adjusting your search or filters.</div>
            ${activeCount || state.historyFilter !== 'all' || state.historySearch ? `
              <button class="btn" style="margin-top:12px;" data-action="history-reset-all">Reset all filters</button>
            ` : ''}
          </div>
        ` : `<div class="insp-list-grid">` + filtered.map(ins => `
          <div class="insp-card">
            <div class="insp-bar ${statusClass(ins.status)}"></div>
            <div class="insp-body">
              <div class="insp-main">
                <div class="insp-id-title">
                  <span class="insp-id">${ins.id}</span>
                  &middot;
                  <span>${ins.model}${ins.variance ? ' ' + ins.variance : ''} ${ins.side}</span>
                </div>
                <div class="insp-meta">
                  ${ins.line} &middot; ${fmtDate(ins.date)}
                  ${ins.result ? ` &middot; <span class="status-text ${statusClass(ins.status)}">${ins.result}</span>` : ''}
                </div>
              </div>
              <div class="status-pill ${statusClass(ins.status)}">${ins.status}</div>
            </div>
          </div>
        `).join('') + `</div>`}
      `;
    }

    // =========================================================
    // ROUTER + RENDER
    // =========================================================
    let lastViewKey = '';
    function render() {
      const main = document.getElementById('main');
      const prevScroll = window.scrollY;   // remember where we are

      if (state.currentTab === 'dashboard') {
        main.innerHTML = renderDashboard();
      } else if (state.currentTab === 'fill') {
        main.innerHTML = state.selectedInspectionId
          ? renderFillDetail(state.selectedInspectionId)
          : renderFillList();
      } else if (state.currentTab === 'history') {
        main.innerHTML = renderHistory();
      }
      // Sync tab bar
      document.querySelectorAll('.tab-bar button').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === state.currentTab);
      });

      // Scroll to top ONLY when the view actually changes (tab switch, open/close
      // inspection). On same-view re-renders (filling items), keep the position.
      const viewKey = state.currentTab + '|' + (state.selectedInspectionId || '');
      if (viewKey !== lastViewKey) {
        window.scrollTo(0, 0);
        lastViewKey = viewKey;
      } else {
        window.scrollTo(0, prevScroll);
      }
    }

    // =========================================================
    // EVENT HANDLERS (delegated)
    // =========================================================
    document.addEventListener('click', e => {
      // ----- Custom dropdown: toggle open/close (works for any .dropdown-btn) -----
      const ddToggle = e.target.closest('.dropdown-btn');
      if (ddToggle) {
        e.stopPropagation();
        const menu = ddToggle.nextElementSibling;  // the menu is always the sibling
        const isOpen = ddToggle.classList.contains('open');
        // Close all other open dropdowns first
        document.querySelectorAll('.dropdown-btn.open').forEach(b => {
          b.classList.remove('open');
          const m = b.nextElementSibling;
          if (m) m.classList.remove('open');
        });
        // Toggle this one (if it wasn't already open)
        if (!isOpen) {
          ddToggle.classList.add('open');
          if (menu) menu.classList.add('open');
        }
        return;
      }

      // ----- Custom dropdown: pick an option (header fields) -----
      const ddOption = e.target.closest('[data-dd-value]');
      if (ddOption) {
        e.stopPropagation();
        const field = ddOption.dataset.ddField;
        const value = ddOption.dataset.ddValue;
        state.planForm[field] = value;
        render();
        return;
      }

      // ----- Custom dropdown: pick an option (model row) -----
      const ddRowOption = e.target.closest('[data-ddrow-value]');
      if (ddRowOption) {
        e.stopPropagation();
        const idx = parseInt(ddRowOption.dataset.ddrowIdx);
        const value = ddRowOption.dataset.ddrowValue;
        if (state.planForm.models[idx]) {
          state.planForm.models[idx].model = value;
          render();
        }
        return;
      }

      // ----- Custom dropdown: pick a variance (model row) -----
      const ddVarOption = e.target.closest('[data-ddvar-value]');
      if (ddVarOption) {
        e.stopPropagation();
        const idx = parseInt(ddVarOption.dataset.ddvarIdx);
        const value = ddVarOption.dataset.ddvarValue;
        if (state.planForm.models[idx]) {
          state.planForm.models[idx].variance = value;
          render();
        }
        return;
      }

      // ----- Custom dropdown: pick a standard value (check-sheet TEXT item) -----
      const stdOption = e.target.closest('[data-std-value]');
      if (stdOption) {
        e.stopPropagation();
        const inspId = stdOption.dataset.stdInsp;
        const ciId = stdOption.dataset.stdCi;
        const pid = stdOption.dataset.stdProc;
        const value = stdOption.dataset.stdValue;
        const key = `${inspId}|${ciId}`;
        const r = DB.results[key] || {};
        r.text = value;
        DB.results[key] = r;
        state.dirtyProcesses[`${inspId}|${pid}`] = true;
        render();
        return;
      }

      // ----- Custom dropdown: pick a PIC (process) -----
      const picOption = e.target.closest('[data-pic-value]');
      if (picOption) {
        e.stopPropagation();
        const procKey = picOption.dataset.picProc;
        const value = picOption.dataset.picValue;
        state.processPIC[procKey] = value;
        // Apply this PIC to all already-filled items in the process, and mark dirty
        state.dirtyProcesses[procKey] = true;
        const [inspId, pid] = procKey.split('|');
        DB.controlItems.forEach(ci => {
          if (ci.process_id === pid) {
            const r = DB.results[`${inspId}|${ci.ci_id}`];
            if (r) r.pic = value;
          }
        });
        render();
        return;
      }

      // ----- Click anywhere else: close any open dropdown -----
      document.querySelectorAll('.dropdown-btn.open').forEach(b => {
        b.classList.remove('open');
        const m = b.nextElementSibling;
        if (m) m.classList.remove('open');
      });

      // Tab switching
      const tabBtn = e.target.closest('.tab-bar button');
      if (tabBtn) {
        state.currentTab = tabBtn.dataset.tab;
        if (state.currentTab !== 'fill') state.selectedInspectionId = null;
        render();
        return;
      }

      // Find action target
      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.dataset.action;

      if (action === 'dashboard-today') {
        state.dashboardDate = todayISO();
        render();
      } else if (action === 'kpi-nav') {
        const target = actionEl.dataset.target;
        const filter = actionEl.dataset.filter;
        state.currentTab = target;
        state.selectedInspectionId = null;
        if (target === 'fill') state.fillFilter = filter;
        if (target === 'history') state.historyFilter = filter;
        render();
      } else if (action === 'set-fill-filter') {
        state.fillFilter = actionEl.dataset.val;
        render();
      } else if (action === 'open-inspection') {
        state.selectedInspectionId = actionEl.dataset.id;
        state.currentTab = 'fill';
        render();
      } else if (action === 'back-to-fill-list') {
        state.selectedInspectionId = null;
        render();
      } else if (action === 'set-judgement') {
        const inspId = actionEl.dataset.insp;
        const ciId = actionEl.dataset.ci;
        const pid = actionEl.dataset.proc;
        const val = actionEl.dataset.val;
        const key = `${inspId}|${ciId}`;
        const existing = DB.results[key] || {};
        // For a model-dependent TEXT item, if no value chosen yet, use the standard
        let textVal = existing.text != null ? existing.text : '';
        const ci = DB.controlItems.find(c => c.ci_id === ciId);
        const ins = getInspection(inspId);
        if (ci && ci.type === 'TEXT' && ci.model_dependent && !textVal && ins) {
          textVal = getStandard(ci, ins.model);
        }
        DB.results[key] = {
          judgement: val,
          value: existing.value != null ? existing.value : '',
          text: textVal,
          pic: state.processPIC[`${inspId}|${pid}`] || ''
        };
        state.dirtyProcesses[`${inspId}|${pid}`] = true;
        render();
      } else if (action === 'save-process') {
        const inspId = actionEl.dataset.insp;
        const pid = actionEl.dataset.proc;
        saveProcess(inspId, pid);
      } else if (action === 'set-history-filter') {
        state.historyFilter = actionEl.dataset.val;
        render();
      } else if (action === 'toggle-history-filters') {
        state.historyFiltersOpen = !state.historyFiltersOpen;
        render();
      } else if (action === 'history-clear-search') {
        state.historySearch = '';
        render();
      } else if (action === 'history-quick-date') {
        const val = actionEl.dataset.val;
        // "Today" is based on the app's demo date. In production this uses the real today.
        const today = '2026-06-30';
        const d = new Date(today);
        if (val === 'today') {
          state.historyDateFrom = today;
          state.historyDateTo = today;
        } else if (val === 'week') {
          const from = new Date(d);
          from.setDate(d.getDate() - 6);
          state.historyDateFrom = from.toISOString().slice(0, 10);
          state.historyDateTo = today;
        } else if (val === 'month') {
          state.historyDateFrom = today.slice(0, 8) + '01';
          state.historyDateTo = today;
        } else if (val === 'clear') {
          state.historyDateFrom = '';
          state.historyDateTo = '';
        }
        render();
      } else if (action === 'history-reset-all') {
        state.historySearch = '';
        state.historyDateFrom = '';
        state.historyDateTo = '';
        state.historyFilter = 'all';
        render();
      } else if (action === 'add-model') {
        // New row starts empty so placeholders show
        state.planForm.models.push({
          model: '',
          variance: '',
          lots: '',
          sides: ['RH-L', 'RH-R']
        });
        render();
      } else if (action === 'remove-model') {
        const idx = parseInt(actionEl.dataset.rowIdx);
        state.planForm.models.splice(idx, 1);
        render();
      } else if (action === 'add-plan') {
        const f = state.planForm;
        const missing = [];
        if (!f.date) missing.push('Date');
        if (!f.line) missing.push('Line');
        if (!f.shift) missing.push('Shift');
        if (!f.customer) missing.push('Customer');
        if (!f.supv) missing.push('Duty Supv');
        if (!f.leader) missing.push('Duty Leader');
        if (missing.length > 0) {
          alert('Please fill: ' + missing.join(', '));
          return;
        }
        const incomplete = f.models.some(m => !m.model || !m.variance || !m.lots || m.sides.length === 0);
        if (incomplete) {
          alert('For each model, pick Model, Variance, Lots, and at least one side');
          return;
        }
        const validModels = f.models.filter(m => m.model && m.variance && m.lots && m.sides.length > 0);
        if (validModels.length === 0) {
          alert('Add at least one complete model row');
          return;
        }

        if (SHEET_API_URL) {
          // CONNECTED: save to Google Sheets so data persists after refresh
          savePlan(f, validModels);
        } else {
          // DEMO MODE: create locally (won't survive refresh)
          let baseNum = DB.inspections.length + 1;
          let created = 0;
          validModels.forEach(m => {
            m.sides.forEach(side => {
              const newId = `INS-2026-${String(baseNum++).padStart(4, '0')}`;
              DB.inspections.push({
                id: newId, date: f.date, model: m.model, side: side,
                line: `${f.line}-DM-${f.shift}`, shift: f.shift,
                variance: m.variance,
                leader: f.leader, status: 'Scheduled', result: '',
                total: 0, done: 0, ng: 0
              });
              created++;
            });
          });
          state.dashboardDate = f.date;
          alert(`Demo mode: created ${created} inspection(s) locally.\n(Connect Google Sheets to save permanently.)`);
          render();
        }
      }
    });

    // Form field changes (native inputs: Date + per-row Model/Lots)
    document.addEventListener('change', e => {

        render();
        return;

      const field = e.target.dataset.field;
      if (field) {
        state.planForm[field] = e.target.value;
        // Clear the grey placeholder styling now that a value is chosen
        if (e.target.value) e.target.classList.remove('is-placeholder');
        else e.target.classList.add('is-placeholder');
        return;
      }
      // Per-row field: Lots (inside model rows). Model is a custom dropdown now.
      const rowIdxAttr = e.target.dataset.rowIdx;
      const rowField = e.target.dataset.rowField;
      if (rowIdxAttr !== undefined && rowField) {
        const row = state.planForm.models[parseInt(rowIdxAttr)];

          if (rowField === 'lots') {
            // Keep empty as empty (shows 'No.' placeholder); otherwise min 1

            row.lots = v === '' ? '' : Math.max(1, parseInt(v) || 1);

    // Side pill toggles (per model row)
    document.addEventListener('click', e => {

    // Live search in History — update the list as the user types.
    // We deliberately DON'T call the full render() here, because re-rendering
    // the whole page would recreate the input and lose focus / cursor position.
    document.addEventListener('input', e => {
      if (e.target.hasAttribute('data-history-search')) {
        state.historySearch = e.target.value;

    // =========================================================
    // DATA LOADING (Google Sheets via Apps Script)
    // =========================================================

    // Normalize a date/datetime value from the sheet to "YYYY-MM-DD"
    function normalizeDate(v) {
      if (!v) return '';
      var s = String(v);
      var m = s.match(/^(\d{4}-\d{2}-\d{2})/);   // ISO or "2026-06-30 08:00"
      if (m) return m[1];
      var d = new Date(s);
      if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
      return s;
    }

    // Format a ModelSpecs row into a display string (e.g. "3.9 ± 0.2 Nm")
    function formatSpecValue(s) {
      if (s.text_value !== '' && s.text_value != null) return String(s.text_value);
      if (s.nominal_value !== '' && s.nominal_value != null) {
        var nom = s.nominal_value, up = s.upper_tol, lo = s.lower_tol, unit = s.unit || '';
        var hasUp = (up !== '' && up != null), hasLo = (lo !== '' && lo != null);
        if (hasUp && hasLo) {
          return (up === lo)
            ? (nom + ' \u00B1 ' + up + ' ' + unit).trim()
            : (nom + ' +' + up + '/-' + lo + ' ' + unit).trim();
        }
        return (nom + ' ' + unit).trim();
      }
      return '';
    }

    // Convert raw sheet rows into the app's internal DB shape
    function transformSheetData(raw) {
      var db = {};

      db.templates = (raw.templates || []).map(function (t) {
        return { template_id: t.template_id, code: t.code, title: t.title,
                 revision: t.revision, line: t.line };
      });

      db.processes = (raw.processes || []).map(function (p) {
        return { process_id: p.process_id, seq: Number(p.seq), name: p.process_name };
      });

      db.controlItems = (raw.controlItems || []).map(function (c) {
        return {
          ci_id: c.control_item_id,
          process_id: c.process_id,
          name: c.control_item,
          type: c.judgement_type,
          standard: c.standard_text || '',
          unit: c.unit || '',
          model_dependent: (c.model_dependent === true ||
                            String(c.model_dependent).toUpperCase() === 'TRUE'),
          applicable_models: (c.applicable_models ? String(c.applicable_models).trim() : 'ALL')
        };
      });

      db.models = (raw.models || []).map(function (m) {
        return { model_code: m.model_code, description: m.description };
      });

      db.modelSpecs = {};
      (raw.modelSpecs || []).forEach(function (s) {
        var val = formatSpecValue(s);
        String(s.model_codes || '').split(',').forEach(function (code) {
          code = code.trim();
          if (code) db.modelSpecs[s.control_item_id + '|' + code] = { value: val };
        });
      });

      db.users = (raw.users || []).map(function (u) {
        return { user_id: u.user_id, name: u.full_name, role: u.role };
      });

      // Helper to resolve a user id → name
      var userName = {};
      db.users.forEach(function (u) { userName[u.user_id] = u.name; });

      db.inspections = (raw.inspections || []).map(function (i) {
        return {
          id: i.inspection_id,
          date: normalizeDate(i.scheduled_at || i.date || ''),
          model: i.model_code,
          side: i.side,
          line: i.asset_line || i.line || '',
          shift: i.shift,
          variance: i.variance || '',
          leader: userName[i.operator_id] || i.leader || '',
          status: i.status,
          result: i.result || '',
          total: Number(i.total_items) || 0,
          done: Number(i.completed_items) || 0,
          ng: Number(i.ng_count) || 0
        };
      });

      db.results = {};
      (raw.results || []).forEach(function (r) {
        db.results[r.inspection_id + '|' + r.control_item_id] = {
          judgement: r.judgement,
          pic: r.recorded_by || '',
          value: r.recorded_value || ''
        };
      });

      return db;
    }

    // Show a simple loading screen in the main area
    function showLoading(msg) {
      document.getElementById('main').innerHTML =
        '<div class="empty-state"><div class="title">' + (msg || 'Loading…') +
        '</div><div class="desc">Please wait a moment.</div></div>';
    }

    // Show an error screen with a retry button
    function showError(err) {
      document.getElementById('main').innerHTML =
        '<div class="empty-state">' +
        '<div class="title">Couldn\'t load data</div>' +
        '<div class="desc">' + String(err) + '</div>' +
        '<button class="btn" style="margin-top:12px;" data-action="retry-load">Try again</button>' +
        '</div>';
    }

    // Fetch data from Google Sheets (or use demo data if no URL set)
    // In demo mode (no sheet connected), shift the sample inspection dates so
    // most land on "today" — otherwise the date-filtered dashboard looks empty.
    function remapDemoDates() {
      const today = todayISO();
      const y = new Date();
      const ymd = (offset) => {
        const d = new Date(y.getFullYear(), y.getMonth(), y.getDate() - offset);
        const off = d.getTimezoneOffset();
        return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
      };
      // 4 today, 1 yesterday — enough to demo the date picker
      const demoDates = [today, today, today, today, ymd(1)];
      DB.inspections.forEach((ins, i) => {
        if (i < demoDates.length) ins.date = demoDates[i];
      });
    }

    async function loadData() {
      if (!SHEET_API_URL) {
        remapDemoDates();  // make demo sample data land on today
        render();          // demo mode — use built-in sample data
        return;
      }
      showLoading('Loading data from Google Sheets…');
      try {
        const res = await fetch(SHEET_API_URL);
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Server returned an error');
        DB = transformSheetData(json.data);
        render();
      } catch (err) {
        showError(err);
      }
    }

    // Save all results for ONE process to Google Sheets
    async function saveProcess(inspId, pid) {
      const ins = getInspection(inspId);
      if (!ins) return;
      const procKey = `${inspId}|${pid}`;
      const pic = state.processPIC[procKey] || '';

      // Gather this process's applicable items + their results
      const items = DB.controlItems.filter(ci =>
        ci.process_id === pid && isApplicable(ci, ins.model));
      const results = items.map(ci => {
        const r = DB.results[`${inspId}|${ci.ci_id}`] || {};
        return {
          ci_id: ci.ci_id,
          judgement: r.judgement || '',
          value: r.value != null ? r.value : '',
          text: r.text != null ? r.text : '',
          pic: pic
        };
      });

      if (!SHEET_API_URL) {
        // Demo mode: just mark clean locally
        delete state.dirtyProcesses[procKey];
        alert('Demo mode: saved ' + pid + ' locally (connect Google Sheets to persist).');
        render();
        return;
      }

      state.savingProcess = procKey;
      render();
      try {
        const res = await fetch(SHEET_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'saveResults',
            inspectionId: inspId,
            processId: pid,
            results: results,
            recordedBy: pic
          })
        });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Save failed');
        // Mark clean; reload fresh data so progress/status reflect the sheet
        delete state.dirtyProcesses[procKey];
        state.savingProcess = null;
        await loadData();
      } catch (err) {
        state.savingProcess = null;
        alert('Could not save ' + pid + ': ' + err);
        render();
      }
    }

    // Save a production plan (+ generate inspections) to Google Sheets
    async function savePlan(f, validModels) {
      const planDate = f.date;
      showLoading('Saving plan to Google Sheets…');
      try {
        // Note: no custom Content-Type header — this keeps it a "simple" request
        // so the browser doesn't block it with a CORS preflight.
        const res = await fetch(SHEET_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'addPlan',
            plan: {
              date: f.date, line: f.line, shift: f.shift,
              customer: f.customer, supv: f.supv, leader: f.leader
            },
            models: validModels.map(m => ({
              model: m.model, variance: m.variance, lots: m.lots, sides: m.sides
            })),
            pcsPerLot: PCS_PER_LOT
          })
        });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Save failed');

        // Reset the form for the next entry
        state.planForm = {
          date: '', line: '', shift: '', customer: '', supv: '', leader: '',
          models: [{ model: '', variance: '', lots: '', sides: ['RH-L', 'RH-R'] }]
        };
        // Jump the dashboard to the plan's date so the new inspections show
        state.dashboardDate = planDate;

        // Reload fresh data from the sheet (now persisted)
        await loadData();

        const n = json.created ? json.created.length : 0;
        alert('Plan saved! ' + n + ' inspection(s) created and stored in Google Sheets.');
      } catch (err) {
        showError(err);
      }
    }

    // Retry button handler
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-action="retry-load"]')) loadData();
    });

    // =========================================================
    // BOOT
    // =========================================================
    loadData();
  </script>
</body>
</html>
